name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Kodu Klonla
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Web Veri Paketini Güncelle
        run: python scripts/build_web_data.py

      - name: Pages Yapılandırması
        uses: actions/configure-pages@v4

      - name: Sayfaları Yükle (Artifact)
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: GitHub Pages'a Yayınla
        id: deployment
        uses: actions/deploy-pages@v4
