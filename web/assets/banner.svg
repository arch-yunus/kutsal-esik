<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="gateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b3541e"/>
      <stop offset="100%" stop-color="#c59b27"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#df7a42" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#fcf9f2" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Arka Plan Halesi -->
  <circle cx="100" cy="100" r="85" fill="url(#sunGlow)"/>

  <!-- Eşik Çemberi -->
  <circle cx="100" cy="100" r="75" fill="none" stroke="url(#gateGrad)" stroke-width="2.5" stroke-dasharray="4 2"/>

  <!-- Eşik / Kapı / Sütunlar -->
  <!-- Sol Sütun -->
  <rect x="68" y="65" width="8" height="85" rx="3" fill="url(#gateGrad)"/>
  <!-- Sağ Sütun -->
  <rect x="124" y="65" width="8" height="85" rx="3" fill="url(#gateGrad)"/>

  <!-- Üst Lento / Kiriş (Kavisli) -->
  <path d="M 52 65 Q 100 50 148 65 Q 100 58 52 65 Z" fill="url(#gateGrad)"/>
  <!-- İkinci Kiriş -->
  <rect x="60" y="75" width="80" height="5" rx="2" fill="url(#gateGrad)"/>

  <!-- Eşik Zemini -->
  <rect x="58" y="148" width="84" height="4" rx="2" fill="url(#gateGrad)"/>

  <!-- Ortadaki Işık / Fener Noktası -->
  <circle cx="100" cy="105" r="7" fill="#c59b27"/>
  <circle cx="100" cy="105" r="14" fill="#df7a42" fill-opacity="0.25"/>
</svg>
